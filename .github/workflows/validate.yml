name: Validate project

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install source package
        run: python -m pip install -e './完整代码'
      - name: Verify saved scenes and run the small planner and simulator
        env:
          MPLBACKEND: Agg
        run: python scripts/check_repository.py --smoke
